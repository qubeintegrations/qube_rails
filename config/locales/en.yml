# Everything the engine's screens say to your users. Override any key in your app's own
# config/locales/*.yml (it loads after this file), or add another locale's file to translate them.
# README, "Wording and translations", lists them.
en:
  qube_rails:
    status:
      in_quickbooks: "In QuickBooks"
      added: "Added to QuickBooks"
      done: "Done"
      done_with: "Done: %{outcome}"
      done_with_errors: "Done, but some didn't go through"
      failed: "Couldn't sync"
      realtime_required: "This company file's connection needs an upgrade to realtime before this can sync."
      not_started: "it couldn't be sent"
      cancelled: "Cancelled"
      cancel_reason: "it was stopped before it finished"
      company_file_changed: "its connection was switched to another company file"
      needs_answer: "Needs your answer"
      starting: "Sending to QuickBooks"
      unconfirmed: "Still waiting for QuickBooks"
      running: "Syncing with QuickBooks"
      cancelling: "Cancelling…"
      quiet: "No update from QuickBooks for a while."
      check_for_updates: "Check for updates"
      try_again: "Try sending again"
      waiting_for_quickbooks: "Waiting for QuickBooks"
      stalled:
        not_checking_in: "QuickBooks hasn't checked in for a while, so this is waiting. Make sure the computer with QuickBooks is on and the Web Connector is running."
        quickbooks_unavailable: "The Web Connector is checking in but can't open QuickBooks. Open the company file in QuickBooks on that computer."
        other: "Syncing with QuickBooks has stopped for now. Check the computer with QuickBooks and its Web Connector."
    connection:
      set_up_again: "Set up QuickBooks again"
      use_different_company_file: "Use a different company file"
    errors:
      not_starting: "This was already sent, so there's nothing to try again."
      not_quiet: "This was updated recently. Check again in a few minutes."
      no_update_yet: "There's no update yet. Check again in a few minutes."
      checked_just_now: "That was checked a moment ago. Try again in a minute."
      unreachable: "Couldn't reach QuickBooks' sync service just now. Try again in a minute."
      disconnect_unreachable: "Couldn't reach QuickBooks' sync service just now. Try disconnecting again in a minute."
      still_syncing: "Something is still syncing with this company file. Let it finish, or answer its question, then disconnect."
      question_changed: "This question changed after the page loaded, so your answer wasn't sent. The page now shows the latest."
      answer_refused: "That answer couldn't be used. Check it and try again."
      answer_refused_with: "That answer couldn't be used: %{detail}"
      question_moved_on: "This question was already answered or has changed, so your answer wasn't sent. If QuickBooks needs anything else, it will ask here."
    question:
      set_all: "Set all to:"
      use_pick: "Use this one"
      # none_of_these and back_to_offered are unused since offered records and their search show
      # at once; they go when qube_sync's Phoenix package drops its copies.
      none_of_these:
        one: "Not this one"
        other: "None of these"
      back_to_offered:
        one: "← Back to the possible match"
        other: "← Back to the %{count} possible matches"
      choose: "Choose…"
      optional: "(optional)"
      needs_script: "Answering this needs JavaScript. Turn it on for this page, or answer from a browser that has it."
      use_for_all:
        one: "Use for the other record too"
        other: "Use for the other %{count} records too"
      used_for_all:
        one: "Also filled in on the other record."
        other: "Also filled in on the other %{count} records."
      search_changed: "This question has changed. Reload the page to see the latest."
      step: "%{position} of %{count}"
      back: "Back"
      next: "Next"
      or: "or"
      pick_a_match: "Pick one of the matches."
      no_matches: "No matches"
      searching: "Searching…"
      search_failed: "Search isn't available right now. Try again in a moment."
      disclose_choice: "or %{label}…"
      search_quickbooks: "Search QuickBooks…"
